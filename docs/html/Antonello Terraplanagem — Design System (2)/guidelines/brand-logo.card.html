<!-- @dsCard group="Brand" viewport="700x160" name="Logo & wordmark" subtitle="Amber tile + excavator mark, locked up with the Archivo wordmark" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:24px 26px; display:flex; align-items:center; gap:40px}
  .lockup{display:flex; align-items:center; gap:13px}
  .tile{width:52px; height:52px; border-radius:15px; background:var(--amarelo); display:grid; place-items:center; flex-shrink:0}
  .tile svg{width:32px; height:32px}
  .wm{font:800 20px/1.02 var(--font-display); letter-spacing:.02em; color:var(--fg)}
  .wm small{display:block; font-weight:600; font-size:11px; letter-spacing:.24em; color:var(--amarelo); margin-top:3px}
  .marks{display:flex; gap:16px; align-items:center; padding-left:36px; border-left:1px solid var(--border)}
  .chip{width:52px; height:52px; border-radius:14px; display:grid; place-items:center}
  .m{font:500 9.5px/1.3 var(--font-mono); color:var(--muted-2); text-align:center; margin-top:7px}
</style>
</head>
<body>
  <div class="lockup">
    <div class="tile">
      <svg viewBox="0 0 24 24" fill="none" stroke="#16140f" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20v-4h4v4"/><path d="m10 16 3-7 5 4v3"/></svg>
    </div>
    <div class="wm">ANTONELLO<small>TERRAPLANAGEM</small></div>
  </div>
  <div class="marks">
    <div><div class="chip" style="background:var(--amarelo)"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#16140f" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20v-4h4v4"/><path d="m10 16 3-7 5 4v3"/></svg></div><div class="m">on amber</div></div>
    <div><div class="chip" style="background:var(--surface-2); border:1px solid var(--border)"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#ffb300" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20v-4h4v4"/><path d="m10 16 3-7 5 4v3"/></svg></div><div class="m">on dark</div></div>
  </div>
</body>
</html>
