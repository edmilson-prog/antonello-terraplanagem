<!-- @dsCard group="Colors" viewport="700x172" name="Status colors" subtitle="Muted earth-toned semantics: success, danger, info — each as fill / text / soft" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:20px 22px}
  .row{display:flex; gap:14px}
  .grp{flex:1}
  .demo{display:flex; align-items:center; gap:8px; padding:12px 13px; border-radius:10px}
  .demo .led{width:8px; height:8px; border-radius:50%; background:currentColor}
  .demo b{font:600 12.5px/1 var(--font-sans)}
  .s-success{background:var(--success-soft); color:var(--success-fg); border:1px solid rgba(76,122,63,.35)}
  .s-danger{background:var(--danger-soft); color:var(--danger-fg); border:1px solid rgba(176,0,32,.32)}
  .s-info{background:var(--info-soft); color:var(--info-fg); border:1px solid rgba(90,127,166,.3)}
  .hex{display:flex; gap:6px; margin-top:9px; font:500 10px/1 var(--font-mono); color:var(--muted-2)}
  .hex i{width:14px; height:14px; border-radius:4px; font-style:normal}
</style>
</head>
<body>
  <div class="row">
    <div class="grp">
      <div class="demo s-success"><span class="led"></span><b>Concluída · Pago</b></div>
      <div class="hex"><i style="background:#4C7A3F"></i>#4C7A3F<i style="background:#9bd08e"></i>#9bd08e</div>
    </div>
    <div class="grp">
      <div class="demo s-danger"><span class="led"></span><b>Vencido</b></div>
      <div class="hex"><i style="background:#b00020"></i>#b00020<i style="background:#e58b7b"></i>#e58b7b</div>
    </div>
    <div class="grp">
      <div class="demo s-info"><span class="led"></span><b>Aberto</b></div>
      <div class="hex"><i style="background:#5a7fa6"></i>#5a7fa6<i style="background:#9db8d6"></i>#9db8d6</div>
    </div>
  </div>
</body>
</html>
