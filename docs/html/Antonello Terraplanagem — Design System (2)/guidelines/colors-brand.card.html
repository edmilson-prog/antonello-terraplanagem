<!-- @dsCard group="Colors" viewport="700x172" name="Amarelo Máquina — brand accent" subtitle="The single brand color: safety amber, used for the one primary action + active state" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:20px 22px}
  .row{display:flex; gap:14px}
  .sw{flex:1; display:flex; flex-direction:column; gap:9px}
  .chip{height:66px; border-radius:10px; border:1px solid var(--border-soft)}
  .lbl b{display:block; font:700 11px/1.2 var(--font-display); letter-spacing:.03em; text-transform:uppercase; color:var(--fg); margin-bottom:4px}
  .lbl span{font:500 11px/1 var(--font-mono); color:var(--muted)}
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#ffb300"></div><div class="lbl"><b>amarelo</b><span>#ffb300</span></div></div>
    <div class="sw"><div class="chip" style="background:#ffc233"></div><div class="lbl"><b>bright</b><span>#ffc233</span></div></div>
    <div class="sw"><div class="chip" style="background:#e39a00"></div><div class="lbl"><b>deep</b><span>#e39a00</span></div></div>
    <div class="sw"><div class="chip" style="background:#c8901a"></div><div class="lbl"><b>dim</b><span>#c8901a</span></div></div>
    <div class="sw"><div class="chip" style="background:rgba(255,179,0,.12)"></div><div class="lbl"><b>soft</b><span>amarelo / 12%</span></div></div>
  </div>
</body>
</html>
