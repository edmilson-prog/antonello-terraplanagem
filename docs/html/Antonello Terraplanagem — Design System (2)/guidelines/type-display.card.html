<!-- @dsCard group="Type" viewport="700x180" name="Display — Archivo" subtitle="Headings & KPIs. Often UPPERCASE + tracked. Weights 700/800" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px; display:flex; flex-direction:column; gap:16px; justify-content:center}
  .h1{font:800 30px/1.05 var(--font-display); letter-spacing:.01em; text-transform:uppercase; color:var(--fg)}
  .title{font:700 13px/1 var(--font-display); letter-spacing:.07em; text-transform:uppercase; color:var(--fg)}
  .kpi{font:700 27px/1 var(--font-display); color:var(--fg)}
  .meta{font:500 11px/1 var(--font-mono); color:var(--muted-2); margin-top:7px}
</style>
</head>
<body>
  <div>
    <div class="h1">Construtora Vale Verde</div>
    <div class="meta">h1 — Archivo 800 · 30px · UPPERCASE · +0.01em</div>
  </div>
  <div style="display:flex; gap:40px; align-items:flex-end">
    <div><div class="title">Ordens de Serviço</div><div class="meta">card title — 700 · 13px · +0.07em</div></div>
    <div><div class="kpi">182</div><div class="meta">KPI — 700 · 27px</div></div>
  </div>
</body>
</html>
