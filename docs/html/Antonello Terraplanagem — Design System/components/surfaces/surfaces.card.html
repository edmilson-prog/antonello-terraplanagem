<!-- @dsCard group="Components" viewport="720x360" name="Surfaces — Card, IconTile, Avatar, Hazard" subtitle="The dark panel, icon tiles, avatars & the hazard motif" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{padding:22px 24px}
  .sec{font:600 10px/1 var(--font-display); letter-spacing:.12em; text-transform:uppercase; color:var(--muted-2); margin:0 0 11px}
  .row{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .block+.block{margin-top:17px; padding-top:17px; border-top:1px solid var(--border-soft)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Card, IconTile, Avatar, Hazard, Pill } = window.AntonelloTerraplanagemDesignSystem_2ede57;
function Demo() {
  return (
    <>
      <div className="block">
        <div className="sec">IconTile — tones · Avatar</div>
        <div className="row">
          <IconTile icon="clipboard-list" />
          <IconTile icon="mail" tone="muted" />
          <IconTile icon="database" tone="steel" />
          <IconTile icon="building-2" size="lg" tone="brand" />
          <span style={{width:16}} />
          <Avatar initials="AA" size={34} />
          <Avatar initials="AM" size={44} shape="square" tone="brand" />
          <Avatar icon="building-2" size={44} shape="square" tone="brand" />
        </div>
      </div>
      <div className="block">
        <div className="sec">Card · Hazard</div>
        <div className="grid2">
          <Card title="Ordens de Serviço" icon="clipboard-list" headerRight={<Pill>4 vinculadas</Pill>} padded>
            <div style={{fontSize:13.5, color:'var(--muted)'}}>Corpo do card — tabelas, listas ou dados.</div>
          </Card>
          <div>
            <Hazard />
            <div style={{height:12}} />
            <Hazard variant="header" />
            <div style={{marginTop:12, font:'500 11px/1.4 var(--font-mono)', color:'var(--muted-2)'}}>Barra 8px (sidebar) · 6px (topo do conteúdo)</div>
          </div>
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
