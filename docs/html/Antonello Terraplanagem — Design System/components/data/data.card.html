<!-- @dsCard group="Components" viewport="720x430" name="Data — KpiCard, Sparkline, DataRow, Note" subtitle="Metric tiles, trend sparklines, cadastral rows & callouts" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{padding:22px 24px}
  .sec{font:600 10px/1 var(--font-display); letter-spacing:.12em; text-transform:uppercase; color:var(--muted-2); margin:0 0 11px}
  .block+.block{margin-top:17px; padding-top:17px; border-top:1px solid var(--border-soft)}
  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { KpiCard, Sparkline, DataRow, Note, Card } = window.AntonelloTerraplanagemDesignSystem_2ede57;
function Demo() {
  return (
    <>
      <div className="block">
        <div className="sec">KpiCard</div>
        <div className="kpis">
          <KpiCard label="Faturado em 2025" value="R$ 148.500" mono icon="credit-card"
            trend={{dir:'up', value:'18%'}} foot="vs. 2024" spark={[19,17,18,12,13,8,9,4]} />
          <KpiCard label="Saldo a receber" value="R$ 32.400" mono warn icon="hand-coins"
            foot={<>3 títulos · <b style={{color:'var(--danger-fg)'}}>1 vencido</b></>} />
          <KpiCard label="Horas apontadas" value="182" unit="h" icon="clock"
            trend={{dir:'up', value:'12%'}} foot="vs. junho" spark={[20,17,19,12,14,8,10,4]} />
        </div>
      </div>
      <div className="block">
        <div className="grid2">
          <Card title="Dados cadastrais" icon="contact" padded>
            <DataRow icon="mail" label="E-mail"><span className="mono">financeiro@valeverde.com.br</span></DataRow>
            <DataRow icon="phone" label="Telefone"><span className="mono">(55) 3312-8800</span></DataRow>
            <DataRow icon="user" label="Contato">Marcos Feltrin · <small>Compras</small></DataRow>
          </Card>
          <div>
            <div className="sec">Sparkline · Note</div>
            <div style={{marginBottom:14}}><Sparkline points={[19,17,18,12,13,8,9,4]} width={120} height={34} /></div>
            <Note icon="info">O <b>snapshot Farolti</b> reflete o histórico anterior à migração e permanece congelado.</Note>
            <div style={{height:10}} />
            <Note icon="lock" tone="steel">Perfil operacional — sem dados financeiros.</Note>
          </div>
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
