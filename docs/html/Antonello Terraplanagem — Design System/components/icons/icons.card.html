<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{padding:20px 22px}
  .grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px}
  .cell{display:flex; flex-direction:column; align-items:center; gap:7px; padding:12px 4px; border-radius:9px; border:1px solid var(--border-soft); color:var(--fg)}
  .cell:hover{border-color:var(--border-strong); color:var(--amarelo); background:#1e1a12}
  .cell span{font:500 8.5px/1.1 var(--font-mono); color:var(--muted-2); text-align:center; word-break:break-word}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const ns = window.AntonelloTerraplanagemDesignSystem_2ede57;
const { Icon, IconNames } = ns;
function Demo() {
  return (
    <div className="grid">
      {IconNames.map((n) => (
        <div className="cell" key={n} title={n}>
          <Icon name={n} size={20} />
          <span>{n}</span>
        </div>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
