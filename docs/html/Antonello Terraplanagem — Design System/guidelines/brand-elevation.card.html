<!-- @dsCard group="Brand" viewport="700x160" name="Elevation, focus & selection" subtitle="Amber glow on brand tiles; 2px amber focus ring; amber text selection" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:24px 26px; display:flex; gap:34px; align-items:center}
  .u{display:flex; flex-direction:column; align-items:flex-start; gap:11px}
  .tile{width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,var(--amarelo),var(--amarelo-deep)); box-shadow:0 6px 20px rgba(255,179,0,.18)}
  .ring{padding:8px 14px; border-radius:10px; background:var(--surface-2); border:1px solid var(--border); outline:2px solid var(--amarelo); outline-offset:2px; font:600 13px/1 var(--font-sans); color:var(--fg)}
  .sel{font:600 15px/1 var(--font-sans); color:var(--fg)}
  .sel mark{background:var(--amarelo); color:#16140f; padding:1px 2px}
  .m{font:500 10px/1 var(--font-mono); color:var(--muted-2)}
</style>
</head>
<body>
  <div class="u"><div class="tile"></div><span class="m">shadow-amarelo</span></div>
  <div class="u"><div class="ring">Botão</div><span class="m">focus · 2px + 2px</span></div>
  <div class="u"><div class="sel"><mark>texto selecionado</mark></div><span class="m">::selection</span></div>
</body>
</html>
