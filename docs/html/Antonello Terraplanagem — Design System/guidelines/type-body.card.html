<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px; display:flex; flex-direction:column; gap:14px; justify-content:center}
  p{font-size:14px; line-height:1.5; color:var(--fg); max-width:600px}
  p b{font-weight:600}
  .weights{display:flex; gap:26px}
  .w{font-size:16px; color:var(--fg)}
  .w span{display:block; font:500 10px/1 var(--font-mono); color:var(--muted-2); margin-top:6px}
</style>
</head>
<body>
  <p>Perfil operacional do operador com <b>apontamentos recentes</b>, horas por semana e equipamentos habilitados — a base para o cálculo de custo-hora.</p>
  <div class="weights">
    <div class="w" style="font-weight:400">Regular<span>400</span></div>
    <div class="w" style="font-weight:500">Medium<span>500</span></div>
    <div class="w" style="font-weight:600">Semibold<span>600</span></div>
    <div class="w" style="font-weight:700">Bold<span>700</span></div>
  </div>
</body>
</html>
