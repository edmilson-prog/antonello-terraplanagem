<!-- @dsCard group="Type" viewport="700x150" name="Eyebrows & labels" subtitle="Uppercase Archivo micro-labels: section eyebrows, KPI labels, data keys" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:22px; display:flex; gap:44px; align-items:center}
  .stack{display:flex; flex-direction:column; gap:14px}
  .eyebrow{font:600 11px/1 var(--font-display); letter-spacing:.14em; text-transform:uppercase; color:var(--muted-2)}
  .kpi-label{font:600 10.5px/1 var(--font-display); letter-spacing:.12em; text-transform:uppercase; color:var(--muted-2)}
  .key{font:600 10px/1 var(--font-display); letter-spacing:.11em; text-transform:uppercase; color:var(--muted-2)}
  .note{font:500 10px/1 var(--font-mono); color:var(--muted-2); margin-top:6px}
  b{color:var(--fg)}
</style>
</head>
<body>
  <div class="stack">
    <div><div class="eyebrow">Operação</div><div class="note">eyebrow · +0.14em</div></div>
    <div><div class="kpi-label">Faturado em 2025</div><div class="note">KPI label · +0.12em</div></div>
    <div><div class="key">CNPJ</div><div class="note">data key · +0.11em</div></div>
  </div>
  <div class="stack">
    <div class="eyebrow" style="color:var(--amarelo); letter-spacing:.22em">Terraplanagem</div>
    <div class="note">wordmark subline · amber · +0.22em</div>
  </div>
</body>
</html>
