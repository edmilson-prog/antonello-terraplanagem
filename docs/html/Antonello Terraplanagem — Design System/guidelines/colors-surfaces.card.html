<!-- @dsCard group="Colors" viewport="700x172" name="Surfaces" subtitle="Warm near-black worksite palette — page, cards, insets, sidebar" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{padding:20px 22px}
  .row{display:flex; gap:14px}
  .sw{flex:1; display:flex; flex-direction:column; gap:9px}
  .chip{height:66px; border-radius:10px; border:1px solid var(--border)}
  .lbl b{display:block; font:700 11px/1.2 var(--font-display); letter-spacing:.03em; text-transform:uppercase; color:var(--fg); margin-bottom:4px}
  .lbl span{font:500 11px/1 var(--font-mono); color:var(--muted)}
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#16140f"></div><div class="lbl"><b>bg</b><span>#16140f</span></div></div>
    <div class="sw"><div class="chip" style="background:#141109"></div><div class="lbl"><b>sidebar</b><span>#141109</span></div></div>
    <div class="sw"><div class="chip" style="background:#211d15"></div><div class="lbl"><b>surface</b><span>#211d15</span></div></div>
    <div class="sw"><div class="chip" style="background:#2c2712"></div><div class="lbl"><b>surface-2</b><span>#2c2712</span></div></div>
    <div class="sw"><div class="chip" style="background:#26221a"></div><div class="lbl"><b>surface-3</b><span>#26221a</span></div></div>
  </div>
</body>
</html>
